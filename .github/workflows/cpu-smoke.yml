name: CPU image generation smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and diffusion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "diffusers>=0.32,<1" "huggingface_hub>=0.25,<2" "transformers>=4.44,<5" "Pillow>=10,<12" "accelerate>=1,<2"
      - name: Run real CPU diffusion inference
        run: python scripts/cpu_smoke.py
      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: henai-cpu-smoke-image
          path: outputs/cpu-smoke.png
          if-no-files-found: error
          retention-days: 7
